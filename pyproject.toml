[project]
name = "yczx-code"
version = "0.1.0a0"
description = "面向学习与实际编码任务的轻量级终端 Coding Agent"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openai>=3.8.0",
    "typer>=0.16.0",
]

[project.scripts]
yczx = "yczx_code.ui.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yczx_code"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
